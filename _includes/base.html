<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ description | default(metadata.description) | default('Learn simple breathwork techniques for relaxation, focus, and well-being.') }}">
    <title>{{ title | default(metadata.title) | default('Simple Breathwork') }}</title>

    <!-- Canonical -->
    <link rel="canonical" href="{{ metadata.url }}{{ page.url }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ title | default(metadata.title) | default('Simple Breathwork') }}">
    <meta property="og:description" content="{{ description | default(metadata.description) | default('Learn simple breathwork techniques for relaxation, focus, and well-being.') }}">
    <meta property="og:type" content="{{ og_type | default('website') }}">
    <meta property="og:url" content="{{ metadata.url }}{{ page.url }}">
    <meta property="og:image" content="{{ metadata.url }}/images/og-image.jpg">
    <meta property="og:site_name" content="Simple Breathwork">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title | default(metadata.title) | default('Simple Breathwork') }}">
    <meta name="twitter:description" content="{{ description | default(metadata.description) | default('Learn simple breathwork techniques for relaxation, focus, and well-being.') }}">
    <meta name="twitter:image" content="{{ metadata.url }}/images/og-image.jpg">

    <!-- JSON-LD: Organisation -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Simple Breathwork",
      "url": "{{ metadata.url }}",
      "description": "Free guided breathwork exercises for stress relief, focus, and wellbeing.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "{{ metadata.email }}",
        "contactType": "customer support"
      }
    }
    </script>

    <!-- Common Stylesheets -->
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {{ additional_head_content | safe }}

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/images/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6E6Q283JEH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6E6Q283JEH');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8592180021114462"
    crossorigin="anonymous"></script>
</head>
<body {% if body_class %}class="{{ body_class }}"{% endif %}>

    {% include "components/header.html" %}

    <main>
      {{ content | safe }}
    </main>

    {% include "components/footer.html" %}

    <script src="/scripts/app.js"></script>
    {{ additional_scripts | safe }}

</body>
</html>
